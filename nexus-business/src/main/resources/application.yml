server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: nexus-business-pos

  flyway:
    enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/his_master?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: his_master_admin
    password: Darick471
    driver-class-name: com.mysql.cj.jdbc.Driver
