spring:
  flyway:
    enabled: false # Apagado de seguridad. El control ahora es 100% de Java.

  datasource:
    url: jdbc:mysql://localhost:3306/core?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: 12345 # En prod, esto se inyecta por variables de sistema
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      # CRÍTICO: Debe cambiar a 'none' cuando se integre Flyway
      ddl-auto: none


  h2:
    console:
      enabled: true

logging:
  level:
    com.OperaUserAccessRequisitionForm: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE