spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false  # Esto evita que Flyway intente buscar esquemas inexistentes
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Crea las tablas básicas en H2 para que el contexto inicie
    show-sql: true
    properties:
      hibernate:
        format_sql: true