server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: nexus-his-server

  flyway:
    enabled: false

  datasource:
    # La URL base apunta a MySQL. El enrutador dinámico cambiará el esquema/catálogo en tiempo real.
    url: jdbc:mysql://localhost:3306/his_master?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
      pool-name: NexusHisTenantPool

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Activación del motor Multi-Tenant de Hibernate
        multiTenancy: DATABASE

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN